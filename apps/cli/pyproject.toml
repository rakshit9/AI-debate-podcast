[project]
name = "podforge-cli"
version = "0.1.0"
description = "PodForge CLI tool"
requires-python = ">=3.11"
dependencies = [
    "podforge-shared-types",
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
]

[tool.uv.sources]
podforge-shared-types = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podforge_cli"]

[project.scripts]
podforge = "podforge_cli.main:app"
