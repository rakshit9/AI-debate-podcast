[project]
name = "podforge-shared-types"
version = "0.1.0"
description = "Shared Pydantic models and type definitions for PodForge"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podforge_shared_types"]
