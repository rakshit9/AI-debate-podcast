[project]
name = "podforge-shared-utils"
version = "0.1.0"
description = "Shared utilities for PodForge"
requires-python = ">=3.11"
dependencies = [
    "podforge-shared-types",
    "structlog>=24.1",
]

[tool.uv.sources]
podforge-shared-types = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podforge_shared_utils"]
