[project]
name = "podforge-agents"
version = "0.1.0"
description = "PodForge agent orchestration — LangGraph pipeline + AutoGen debates + LangChain chains"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    "langsmith>=0.1",
    "autogen-agentchat>=0.4",
    "autogen-ext[openai,anthropic]>=0.4",
    "anthropic>=0.28",
    "openai>=1.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[asyncio,binary]>=3.1",
    "httpx>=0.27",
    "redis[asyncio]>=5.0",
    "podforge-shared-types",
    "podforge-shared-utils",
    "podforge-research-mcp",
    "podforge-audio-mcp",
    "podforge-publish-mcp",
    "podforge-memory-mcp",
    "podforge-music-mcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podforge_agents"]

[tool.uv.sources]
podforge-shared-types = { workspace = true }
podforge-shared-utils = { workspace = true }
podforge-research-mcp = { workspace = true }
podforge-audio-mcp = { workspace = true }
podforge-publish-mcp = { workspace = true }
podforge-memory-mcp = { workspace = true }
podforge-music-mcp = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
