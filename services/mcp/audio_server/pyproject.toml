[project]
name = "podforge-audio-mcp"
version = "0.1.0"
description = "PodForge audio MCP server — TTS, mixing, waveform, transcription"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "elevenlabs>=1.2",
    "openai>=1.30",
    "pydub>=0.25",
    "boto3>=1.34",
    "httpx>=0.27",
    "podforge-shared-types",
    "podforge-shared-utils",
]

[project.scripts]
audio-mcp = "podforge_audio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podforge_audio_mcp"]

[tool.uv.sources]
podforge-shared-types = { workspace = true }
podforge-shared-utils = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
