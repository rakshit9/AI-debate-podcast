[tool.uv]
dev-dependencies = [
    "pre-commit>=3.7",
    "commitizen>=3.27",
    "ruff>=0.4.4",
    "mypy>=1.10",
    "sqlalchemy[mypy]>=2.0.30",
    "pytest>=8.2",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0",
    "anyio>=4.3",
    "httpx>=0.27",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/cli",
    "packages/shared_types",
    "packages/shared_utils",
]

# ─── Ruff (shared defaults, overridable per package) ───────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "ANN"]
ignore = ["ANN401", "B008", "B904", "S105"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ANN", "S105"]
"**/alembic/env.py" = ["ANN", "E501"]
"**/alembic/versions/**" = ["ANN", "E501", "UP", "I", "W"]
"**/config.py" = ["S105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy (shared baseline) ────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
